spring:
  config:
    activate:
      on-profile: "local"
  datasource:
    leader:
      jdbc-url: jdbc:oracle:thin:@localhost:1521:xe
      username: onecore
      password: onecore
      minimum-idle: 1
      maximum-pool-size: 5
      max-lifetime: 30000
    follower:
      jdbc-url: jdbc:oracle:thin:@localhost:1521:xe
      username: onecore
      password: onecore
      minimum-idle: 1
      maximum-pool-size: 5
      max-lifetime: 30000
    driver-class-name: oracle.jdbc.OracleDriver

  data:
    mongodb:
      uri: mongodb://admin:password@localhost:27017/oncore_db?authSource=admin
    redis:
      host: localhost
      port: 6379

  jpa:
    database-platform: org.hibernate.dialect.Oracle12cDialect
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true


  application:
    name: oncore-hr