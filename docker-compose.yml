version: '3.8'

services:
  # 1. Oracle Database (Java 11/ojdbc8과 호환성이 좋은 XE 버전)
  oracle:
    image: gvenzl/oracle-xe:11
    container_name: oracle-db
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=onecore
      - APP_USER=onecore
      - APP_USER_PASSWORD=onecore
    volumes:
      - oracle_data:/opt/oracle/oradata

  # 2. Redis (공식 이미지 사용으로 변경)
  redis:
    image: redis:6.2-alpine
    container_name: redis-local
    ports:
      - "6379:6379"
    # 로컬 테스트용이므로 별도의 비밀번호 없이 실행
    command: redis-server --save 60 1 --loglevel warning

  # 3. MongoDB
  mongodb:
    image: mongo:4.4
    container_name: mongodb-local
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - mongo_data:/data/db

volumes:
  oracle_data:
  mongo_data: